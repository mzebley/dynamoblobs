<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8">
  <title>Dynamoblobs - generative SVG blobs</title>
  <meta name="description" content="Dependency-free SVG blobs that generate, wobble, morph, and drift on render.">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="mask-icon" href="./safari-pinned-tab.svg" color="#557c7c">
  <meta property="og:title" content="Dynamoblobs">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dynamoblobs.markzebley.com">
  <meta name="og:description" content="Dependency-free SVG blobs that generate, wobble, morph, and drift on render.">
  <meta name="msapplication-TileColor" content="#e4ecec">
  <meta name="theme-color" content="#c5d8d7">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    (function () {
      const root = document.documentElement;
      const storageKey = "dynamoblobs-theme";

      const readStoredTheme = () => {
        try { return window.localStorage.getItem(storageKey); } catch (error) { return null; }
      };

      const prefersDark = () => {
        try { return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; }
        catch (error) { return false; }
      };

      const storedTheme = readStoredTheme();
      const theme = storedTheme === "dark" || storedTheme === "light"
        ? storedTheme
        : prefersDark() ? "dark" : "light";

      root.dataset.theme = theme;
      root.dataset.themeSource = storedTheme ? "manual" : "system";
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/dark.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/theme-toggles@4.10.1/css/within.min.css" integrity="sha256-4qLHDhzuDV3IgrWCWtrSlFovj05xXNXXOjXF5Oxsg4Y=" crossorigin="anonymous">

  <link rel="stylesheet" href="normalize.css">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="zbk-dynamoblobs.min.css">
  <style>
    .wordmark {
      font-family: 'Merriweather', serif;
      color: var(--theme-dark);
      font-size: clamp(2.5rem, 8vw, 4rem);
      margin: 1rem 0 0;
      line-height: 1;
    }
    .blob-hero {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin: 1.5rem 0;
      min-height: 130px;
    }
  </style>
</head>

<body style="overflow:hidden" class="ink-app canvas-brand-200 display-flex font-primary font-md flex-direction-column justify-content-between line-height-5">
  <header class="canvas-brand-200 display-flex flex-direction-column align-items-center padding-inline-105 padding-block-start-105">
    <label tabindex="0" class="theme-toggle" title="Toggle theme">
      <input type="checkbox" id="theme-toggle-input" />
      <span class="theme-toggle-sr">Toggle theme</span>
      <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="theme-toggle__within" height="1em" width="1em" viewBox="0 0 32 32" fill="currentColor">
        <clipPath id="theme-toggle__within__clip">
          <path d="M0 0h32v32h-32ZM6 16A1 1 0 0026 16 1 1 0 006 16" />
        </clipPath>
        <g clip-path="url(#theme-toggle__within__clip)">
          <path d="M30.7 21.3 27.1 16l3.7-5.3c.4-.5.1-1.3-.6-1.4l-6.3-1.1-1.1-6.3c-.1-.6-.8-.9-1.4-.6L16 5l-5.4-3.7c-.5-.4-1.3-.1-1.4.6l-1 6.3-6.4 1.1c-.6.1-.9.9-.6 1.3L4.9 16l-3.7 5.3c-.4.5-.1 1.3.6 1.4l6.3 1.1 1.1 6.3c.1.6.8.9 1.4.6l5.3-3.7 5.3 3.7c.5.4 1.3.1 1.4-.6l1.1-6.3 6.3-1.1c.8-.1 1.1-.8.7-1.4zM16 25.1c-5.1 0-9.1-4.1-9.1-9.1 0-5.1 4.1-9.1 9.1-9.1s9.1 4.1 9.1 9.1c0 5.1-4 9.1-9.1 9.1z" />
        </g>
        <path class="theme-toggle__within__circle" d="M16 7.7c-4.6 0-8.2 3.7-8.2 8.2s3.6 8.4 8.2 8.4 8.2-3.7 8.2-8.2-3.6-8.4-8.2-8.4zm0 14.4c-3.4 0-6.1-2.9-6.1-6.2s2.7-6.1 6.1-6.1c3.4 0 6.1 2.9 6.1 6.2s-2.7 6.1-6.1 6.1z" />
        <path class="theme-toggle__within__inner" d="M16 9.5c-3.6 0-6.4 2.9-6.4 6.4s2.8 6.5 6.4 6.5 6.4-2.9 6.4-6.4-2.8-6.5-6.4-6.5z" />
      </svg>
    </label>

    <h1 class="wordmark" id="heading">Dynamoblobs</h1>
    <p class="ink-brand-700 font-lg measure-2 margin-block-start-1 margin-block-end-2" style="text-align:center">
      Buttery smooth <strong>SVG blobs</strong> that <strong id="shuffle">generate, wobble &amp; morph</strong> on render.<br>
      <span class="display-inline-block ink-brand-00 font-sm margin-block-start-05">
        <em>Tiny and dependency-free.</em>
      </span>
    </p>

    <div class="blob-hero">
      <dynamo-blob class="fill-theme" data-blob-animate="true" data-blob-speed="6000" data-blob-points="10" data-blob-variance="10" style="width:96px;height:96px"></dynamo-blob>
      <dynamo-blob class="fill-theme fill-light" data-blob-points="7" data-blob-variance="12" style="width:120px;height:120px"></dynamo-blob>
      <dynamo-blob class="fill-theme" data-blob-animate="true" data-blob-speed="9000" data-blob-points="16" data-blob-variance="8" style="width:80px;height:80px"></dynamo-blob>
      <dynamo-blob class="fill-theme fill-light" data-blob-points="12" data-blob-variance="14" style="width:104px;height:104px"></dynamo-blob>
    </div>
    <div style="margin-bottom:1.5rem">
      <button onclick="regenAll()"><i data-feather="refresh-cw" class="refresh"></i>Regenerate</button>
    </div>

    <div id="loading">
      <div class="loader" tabindex="0" aria-label="loading content"></div>
    </div>
  </header>

  <main class="content-layout canvas-app">
    <aside id="toc" aria-label="Table of contents">
      <div class="toc-placeholder">Loading table of contents…</div>
    </aside>
    <div class="content-column">
      <section class="box" aria-labelledby="installationHeader">
        <div data-snippet="installation-header"></div>
        <div data-snippet="npm-installation"></div>
        <div data-snippet="angular-installation"></div>
        <div data-snippet="script-installation"></div>
      </section>
      <section class="box" aria-labelledby="usageHeader">
        <div data-snippet="usage-header"></div>
        <div data-snippet="data-attributes"></div>
        <div data-snippet="usage-functions"></div>
      </section>
      <section class="box margin-block-start-1" aria-labelledby="practicalApplicationHeader">
        <div data-snippet="examples"></div>
      </section>
    </div>
  </main>

  <footer class="canvas-brand-200 padding-inline-105 padding-block-end-05 display-flex">
    <div style="align-self: center;">
      <a href="https://github.com/mzebley/dynamoblobs" rel="external" style="display:inline-flex;align-items: center;gap:.25rem" aria-label="External link to Dynamoblobs on Github" target="_blank">
        <i style="color:var(--theme);margin: -2px 0.5rem 0 0;" data-feather="github"></i>
        <p style="font-size:1rem;color:var(--theme-dark);line-height: 1.325rem;">
          <em><strong>Dynamoblobs</strong></em><br>on <strong>Github</strong>
        </p>
      </a>
    </div>
    <div style="align-self: center;">
      <a href="https://www.npmjs.com/package/dynamoblobs" rel="external" style="display:inline-flex;align-items: center;gap:.25rem" aria-label="External link to Dynamoblobs on npmjs" target="_blank">
        <i style="color:var(--theme);margin: -2px 0.5rem 0 0;" data-feather="code"></i>
        <p style="font-size:1rem;color:var(--theme-dark);line-height: 1.325rem;">
          <em><strong>Dynamoblobs</strong></em><br>on <strong>npmjs</strong>
        </p>
      </a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script type="module">
    const snippetTargets = document.querySelectorAll("[data-snippet]");
    const snippetTargetMap = new Map();

    snippetTargets.forEach((el) => {
      const slug = el.dataset.snippet;
      if (!slug) return;
      if (!el.id) el.id = `snippet-${slug}`;
      snippetTargetMap.set(slug, el);
    });

    const highlightIfAvailable = () => {
      if (window.hljs?.highlightAll) window.hljs.highlightAll();
    };

    const setLoadingAnimation = () => {
      const loader = document.getElementById("loading");
      if (!loader) { document.body.style.overflow = ""; return; }
      loader.classList.add("hide");
      setTimeout(() => { loader.innerHTML = ""; document.body.style.overflow = ""; }, 225);
    };

    const buildTableOfContents = (entries = []) => {
      const toc = document.getElementById("toc");
      if (!toc) return;

      const grouped = entries.reduce((acc, entry) => {
        const slug = entry.slug;
        if (!slug || !snippetTargetMap.has(slug)) return acc;
        const groupKey = entry.extra?.group ?? entry.group;
        if (!groupKey) return acc;
        const label = entry.extra?.groupLabel ?? groupKey.replace(/-/g, " ");
        const groupOrder = Number(entry.extra?.groupOrder ?? entry.order ?? Number.MAX_SAFE_INTEGER);
        const itemOrder = Number(entry.order ?? Number.MAX_SAFE_INTEGER);
        if (!acc[groupKey]) acc[groupKey] = { label, order: groupOrder, items: [] };
        acc[groupKey].order = Math.min(acc[groupKey].order, groupOrder);
        acc[groupKey].items.push({ label: entry.title ?? slug, slug, order: itemOrder });
        return acc;
      }, {});

      const groupEntries = Object.values(grouped)
        .map((group) => ({ ...group, items: group.items.sort((a, b) => a.order - b.order) }))
        .sort((a, b) => a.order - b.order);

      toc.innerHTML = "";
      if (!groupEntries.length) {
        toc.innerHTML = '<p class="toc-empty">Snippets with group metadata will appear here.</p>';
        return;
      }

      const heading = document.createElement("p");
      heading.className = "toc-heading";
      heading.textContent = "On this page";
      toc.appendChild(heading);

      groupEntries.forEach((group) => {
        const wrapper = document.createElement("div");
        wrapper.className = "toc-group";
        const title = document.createElement("p");
        title.className = "toc-group-title";
        title.textContent = group.label;
        wrapper.appendChild(title);
        const list = document.createElement("ul");
        list.className = "toc-list";
        group.items.forEach((item) => {
          const target = snippetTargetMap.get(item.slug);
          if (!target) return;
          const li = document.createElement("li");
          const link = document.createElement("a");
          link.href = `#${target.id}`;
          link.textContent = item.label;
          link.className = "toc-link";
          link.addEventListener("click", (event) => {
            event.preventDefault();
            target.scrollIntoView({ behavior: "smooth", block: "start" });
            if (window.history?.replaceState) window.history.replaceState(null, "", `#${target.id}`);
          });
          li.appendChild(link);
          list.appendChild(li);
        });
        if (list.children.length) { wrapper.appendChild(list); toc.appendChild(wrapper); }
      });
    };

    async function init() {
      try {
        const response = await fetch("./snippets/snippets-index.json");
        if (!response.ok) throw new Error(`Failed to fetch manifest: ${response.status}`);
        const manifest = await response.json();
        buildTableOfContents(manifest);
      } catch (error) {
        console.error("mark↓: failed to build table of contents", error);
        const toc = document.getElementById("toc");
        if (toc && !toc.innerHTML.trim()) toc.innerHTML = '<p class="toc-empty">Table of contents unavailable.</p>';
      } finally {
        highlightIfAvailable();
        setLoadingAnimation();
        if (window.feather?.replace) feather.replace({ "stroke-width": ".175rem" });
      }
    }

    if (snippetTargets.length > 0) {
      init();
    } else {
      highlightIfAvailable();
      setLoadingAnimation();
      if (window.feather?.replace) feather.replace({ "stroke-width": ".175rem" });
    }
  </script>
  <script>
    (function () {
      const storageKey = "dynamoblobs-theme";
      const root = document.documentElement;
      const toggleLabel = document.querySelector(".theme-toggle");
      const toggle = document.querySelector(".theme-toggle input[type=\"checkbox\"]");
      const mediaQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

      const readStoredTheme = () => { try { return window.localStorage.getItem(storageKey); } catch (e) { return null; } };
      const writeStoredTheme = (v) => { try { window.localStorage.setItem(storageKey, v); } catch (e) {} };
      const clearStoredTheme = () => { try { window.localStorage.removeItem(storageKey); } catch (e) {} };

      const applyTheme = (theme, source) => {
        const nextTheme = theme === "dark" ? "dark" : "light";
        root.dataset.theme = nextTheme;
        root.dataset.themeSource = source;
        if (toggle) toggle.checked = nextTheme === "dark";
      };

      const storedTheme = (() => {
        const value = readStoredTheme();
        return value === "dark" || value === "light" ? value : null;
      })();

      const initialTheme = root.dataset.theme || storedTheme || (mediaQuery && mediaQuery.matches ? "dark" : "light");
      const initialSource = root.dataset.themeSource || (storedTheme ? "manual" : "system");
      applyTheme(initialTheme, initialSource);

      const handleToggle = (event) => {
        const nextTheme = event.target.checked ? "dark" : "light";
        applyTheme(nextTheme, "manual");
        writeStoredTheme(nextTheme);
      };
      if (toggle) toggle.addEventListener("change", handleToggle);

      const handleLabelKeydown = (event) => {
        const isActivationKey = event.key === "Enter" || event.key === " " || event.key === "Spacebar";
        if (!isActivationKey || !toggle) return;
        event.preventDefault();
        toggle.checked = !toggle.checked;
        toggle.dispatchEvent(new Event("change", { bubbles: true }));
      };
      if (toggleLabel) toggleLabel.addEventListener("keydown", handleLabelKeydown);

      const handleSystemPreferenceChange = (event) => {
        if (root.dataset.themeSource === "manual") return;
        applyTheme(event.matches ? "dark" : "light", "system");
        clearStoredTheme();
      };
      if (mediaQuery) {
        if (mediaQuery.addEventListener) mediaQuery.addEventListener("change", handleSystemPreferenceChange);
        else if (mediaQuery.addListener) mediaQuery.addListener(handleSystemPreferenceChange);
      }
    })();
  </script>
  <script>
    function regenBlob(id, duration = 800) { document.getElementById(id)?.generateNewBlob(duration); }
    function play(id, duration = 7500) { document.getElementById(id)?.play(duration); }
    function pause(id) { document.getElementById(id)?.pause(); }
    function regenAll() {
      document.querySelectorAll(".blob-hero dynamo-blob").forEach((b) => b.generateNewBlob(700));
    }
    function transition() {
      document.getElementById("transition-blob-example")?.generateNewBlob(500);
    }
  </script>
  <script src="dynamoblobs.min.js"></script>

</body>

</html>
