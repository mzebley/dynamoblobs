name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Release candidate version, for example 1.0.0-rc.1
        required: true
        type: string
      publish_to_registries:
        description: Publish this candidate with the next dist-tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version || github.sha }}
  cancel-in-progress: false

jobs:
  context:
    name: Resolve release context
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.context.outputs.should_release }}
      publish: ${{ steps.context.outputs.publish }}
      version: ${{ steps.context.outputs.version }}
      channel: ${{ steps.context.outputs.channel }}
      prerelease: ${{ steps.context.outputs.prerelease }}
      head_branch: ${{ steps.context.outputs.head_branch }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      pr_title: ${{ steps.context.outputs.pr_title }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve candidate or production release
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          RELEASE_PUBLISH: ${{ inputs.publish_to_registries }}
        run: node scripts/release/resolve-context.mjs

  package:
    name: Build inspected packages
    if: needs.context.outputs.should_release == 'true'
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.pack.outputs.version }}
      npm_tarball: ${{ steps.pack.outputs.npm_tarball }}
      npm_integrity: ${{ steps.pack.outputs.npm_integrity }}
      github_tarball: ${{ steps.pack.outputs.github_tarball }}
      github_integrity: ${{ steps.pack.outputs.github_integrity }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch release candidate commit
        if: github.event_name == 'push'
        env:
          RELEASE_HEAD_SHA: ${{ needs.context.outputs.head_sha }}
        run: git fetch --no-tags origin "$RELEASE_HEAD_SHA"

      - name: Setup Node and private dependency registry
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@mzebley'

      - name: Install lifecycle-safe npm
        run: npm install --global "npm@>=11.5.1 <12"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --ignore-scripts

      - name: Validate release state
        if: github.event_name == 'push'
        env:
          RELEASE_HEAD_BRANCH: ${{ needs.context.outputs.head_branch }}
          RELEASE_HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          RELEASE_PR_TITLE: ${{ needs.context.outputs.pr_title }}
        run: node scripts/release/check-release.mjs

      - name: Validate release candidate state
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_HEAD_BRANCH: ${{ needs.context.outputs.head_branch }}
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: node scripts/release/check-candidate.mjs "$RELEASE_VERSION"

      - name: Run the release gate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run gate

      - name: Reject generated drift
        run: npm run check:generated

      - name: Pack and inspect both registry packages
        id: pack
        env:
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: |
          node scripts/release/pack-package.mjs release-artifacts "$RELEASE_VERSION"
          node scripts/release/check-package.mjs release-artifacts/pack.json >> "$GITHUB_OUTPUT"

      - name: Upload immutable package candidates
        uses: actions/upload-artifact@v7
        with:
          name: dynamoblobs-${{ steps.pack.outputs.version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 90

  publish_github:
    name: Publish GitHub Package
    if: needs.context.outputs.publish == 'true' && needs.package.result == 'success'
    needs: [context, package]
    runs-on: ubuntu-latest
    environment: github-packages
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download inspected packages
        uses: actions/download-artifact@v8
        with:
          name: dynamoblobs-${{ needs.package.outputs.version }}
          path: release-artifacts

      - name: Configure GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          registry-url: https://npm.pkg.github.com
          scope: '@mzebley'

      - name: Publish the scoped mirror
        env:
          EXPECTED_INTEGRITY: ${{ needs.package.outputs.github_integrity }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANNEL: ${{ needs.context.outputs.channel }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          package="@mzebley/dynamoblobs@${RELEASE_VERSION}"
          error_log="${RUNNER_TEMP}/github-package-view-error.log"
          if published_integrity="$(npm view "${package}" dist.integrity --registry=https://npm.pkg.github.com 2>"${error_log}")"; then
            if [ "${published_integrity}" != "${EXPECTED_INTEGRITY}" ]; then
              echo "::error::${package} already exists with different contents."
              exit 1
            fi
            echo "${package} already exists with matching integrity; skipping publish."
            exit 0
          fi
          if ! grep -q 'E404' "${error_log}"; then
            cat "${error_log}" >&2
            exit 1
          fi
          npm publish "${{ needs.package.outputs.github_tarball }}" --ignore-scripts --registry=https://npm.pkg.github.com --tag "${RELEASE_CHANNEL}"

  publish_npm:
    name: Publish npm Package
    if: vars.PUBLISH_NPM == 'true' && needs.context.outputs.publish == 'true' && needs.package.result == 'success'
    needs: [context, package]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download inspected packages
        uses: actions/download-artifact@v8
        with:
          name: dynamoblobs-${{ needs.package.outputs.version }}
          path: release-artifacts

      - name: Configure npmjs.org
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Install an OIDC-capable npm CLI
        run: npm install --global "npm@>=11.5.1 <12"

      - name: Publish the canonical package
        env:
          EXPECTED_INTEGRITY: ${{ needs.package.outputs.npm_integrity }}
          RELEASE_CHANNEL: ${{ needs.context.outputs.channel }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          package="dynamoblobs@${RELEASE_VERSION}"
          error_log="${RUNNER_TEMP}/npm-package-view-error.log"
          if published_integrity="$(npm view "${package}" dist.integrity --registry=https://registry.npmjs.org 2>"${error_log}")"; then
            if [ "${published_integrity}" != "${EXPECTED_INTEGRITY}" ]; then
              echo "::error::${package} already exists with different contents."
              exit 1
            fi
            echo "${package} already exists with matching integrity; skipping publish."
            exit 0
          fi
          if ! grep -q 'E404' "${error_log}"; then
            cat "${error_log}" >&2
            exit 1
          fi
          npm publish "${{ needs.package.outputs.npm_tarball }}" --ignore-scripts --registry=https://registry.npmjs.org --tag "${RELEASE_CHANNEL}"

  finalize:
    name: Tag and create GitHub Release
    if: >-
      always() &&
      needs.context.outputs.publish == 'true' &&
      needs.package.result == 'success' &&
      needs.publish_github.result == 'success' &&
      (needs.publish_npm.result == 'success' || needs.publish_npm.result == 'skipped')
    needs: [context, package, publish_github, publish_npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download inspected packages
        uses: actions/download-artifact@v8
        with:
          name: dynamoblobs-${{ needs.package.outputs.version }}
          path: release-artifacts

      - name: Create immutable release tag
        env:
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            git fetch --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
            if [ "$(git rev-list -n 1 "${tag}")" != "$GITHUB_SHA" ]; then
              echo "::error::${tag} already points to a different commit."
              exit 1
            fi
          else
            git tag -a "${tag}" -m "Release ${tag}"
            git push origin "refs/tags/${tag}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          PRERELEASE: ${{ needs.context.outputs.prerelease }}
        run: |
          tag="v${RELEASE_VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" release-artifacts/*.tgz release-artifacts/pack.json --clobber
            exit 0
          fi
          args=("${tag}" --verify-tag --generate-notes --title "${tag}")
          if [ "${PRERELEASE}" = "true" ]; then args+=(--prerelease); fi
          gh release create "${args[@]}" release-artifacts/*.tgz release-artifacts/pack.json
